<body>
  <section class="kort">
    <h2>Logger ut...</h2>
    <p>Vent et øyeblikk.</p>
  </section>

  <script>
  (function(){
    try {
      const keep = [];
      for (let i = 0; i < localStorage.length; i++) {
        keep.push(localStorage.key(i));
      }
      keep.forEach(function(k){
        if (
          k === "rettilommaValgtModul" ||
          k === "rettilommaSistEpost" ||
          k === "handInnloggetEpost" ||
          k === "innloggetEpost" ||
          k === "handInnloggetRolle" ||
          k === "rilAdminModus" ||
          k === "rilSysadminModus" ||
          k === "aktivBilId" ||
          k === "aktivBilNavn" ||
          k === "aktivFirmaId" ||
          k === "firmaId" ||
          k === "firma_id" ||
          k.startsWith("sb-")
        ) {
          localStorage.removeItem(k);
        }
      });
      sessionStorage.clear();
    } catch(e) {}

    window.location.replace("index.html?logout=1&t=" + Date.now());
  })();
  </script>
</body>
