  <script>
  (function () {
    function partialUrl(holder) {
      return holder.getAttribute("data-hand-partial") + "?v=20260623-inline-app-hidden";
    }

    function hentPartialer() {
      return Array.from(document.querySelectorAll("[data-hand-partial]"));
    }

    function varslePartialerKlare() {
      document.dispatchEvent(new Event("handPartialerLastet"));
      if (typeof window.handFyllFirmaVelgereDirekte === "function") window.handFyllFirmaVelgereDirekte();
      if (typeof window.handKobleKnapperEtterPartials === "function") window.handKobleKnapperEtterPartials();
      if (typeof window.handKobleVarerKnapper === "function") window.handKobleVarerKnapper();
    }

    function lastPartialerSynkront() {
      const holders = hentPartialer();
      for (const holder of holders) {
        const url = partialUrl(holder);
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        xhr.setRequestHeader("Cache-Control", "no-store");
        xhr.send(null);
        if ((xhr.status < 200 || xhr.status >= 300) && xhr.status !== 0) {
          throw new Error("Kunne ikke laste " + url);
        }
        holder.outerHTML = xhr.responseText;
      }
    }

    async function lastPartialerAsynkront() {
      const holders = hentPartialer();
      for (const holder of holders) {
        const url = partialUrl(holder);
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("Kunne ikke laste " + url);
        holder.outerHTML = await res.text();
      }
    }

    try {
      lastPartialerSynkront();
      window.__handPartialerLastet = true;
      window.handPartialerKlare = Promise.resolve();
    } catch (e) {
      console.warn("Synkron lasting av partials feilet, bruker asynkron fallback:", e);
      window.handPartialerKlare = lastPartialerAsynkront().then(function () {
        window.__handPartialerLastet = true;
      });
    }

    window.handPartialerKlare
      .then(function () { setTimeout(varslePartialerKlare, 0); })
      .catch(function (e) {
        console.error("Partialer ble ikke ferdig lastet:", e);
        const appSide = document.getElementById("appSide");
        if (appSide) {
          appSide.innerHTML = '<section class="kort"><h2>Kunne ikke laste Håndverker</h2><div class="melding">Oppdater siden. Hvis feilen fortsetter, sjekk at partial-filene ligger i handverker/partials.</div></section>';
          appSide.classList.remove("skjult");
        }
      });
  })();
  </script>



<script id="hand-minbil-prod-7084">
/* PROD 7084: Min bil for ansatte. Denne ligger i index tidlig, etter partials og før alle andre moduler,
   slik at knappen virker selv om senere admin/bestillingsscript har feil. */
(function(){
  'use strict';
  function $(id){ return document.getElementById(id); }
  function show(el){
    if(!el) return;
    el.hidden = false;
    el.style.display = '';
    el.style.visibility = 'visible';
    if(el.classList) el.classList.remove('skjult','hidden','modul-skjult','ril-starter');
    if(el.removeAttribute) el.removeAttribute('aria-hidden');
  }
  function hide(el){
    if(!el) return;
    el.hidden = true;
    el.style.display = 'none';
    if(el.classList) el.classList.add('skjult','hidden');
    if(el.setAttribute) el.setAttribute('aria-hidden','true');
  }
  var sideIds = ['timerSide','jobberSide','fravaerSide','tilbudSide','backupSide','fakturaSide','varerSide','kundeSide','kunderSide','ansattSide','ansatteSide','firmaSide','testSide','testpanelSide','lonnPanel','lonnSide','bilBestillingerSide','adminBilBestillinger','adminBilBestillingerPanel','modulerSide','sysadminPanelSide','adminSide','adminKonsollSide'];
  function ensureBilerSide(){
    var side = $('bilerSide');
    if(side) return side;
    var app = $('appSide') || document.body;
    side = document.createElement('section');
    side.id = 'bilerSide';
    side.className = 'kort';
    side.setAttribute('data-modul','biler');
    side.innerHTML = '<h2>Min bil / lager</h2><div id="bilMelding" class="melding"></div><div id="bilLagerListe"></div><div id="bilLagerFyllListe"></div>';
    app.appendChild(side);
    return side;
  }
  function initBiler(){
    ['lastBiler','lastBilLager','lastBilerOgBilLager','handLastBiler','fyllAlleBilvalg','fyllBilvalg','fyllBilvalgTrygt','begrensBilLagerForVanligBruker','fyllBilLagerVareValg','fyllVarevalgFraAktivBil'].forEach(function(fn){
      if(typeof window[fn] === 'function') setTimeout(function(){ try{ window[fn](); }catch(e){ console.warn('Min bil init feilet:', fn, e); } }, 20);
    });
  }
  function openMinBil(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); if(ev.stopImmediatePropagation) ev.stopImmediatePropagation(); }
    var app = $('appSide');
    show(app);
    if(app){ app.classList.remove('ril-starter','skjult','hidden'); app.hidden=false; app.style.display=''; app.removeAttribute('aria-hidden'); }
    sideIds.forEach(function(id){ hide($(id)); });
    var side = ensureBilerSide();
    show(side);
    var h = $('handSideOverskrift') || document.querySelector('#appSide h1');
    if(h) h.textContent = 'Min bil / fyll lager';
    var h2 = side.querySelector('h2');
    if(h2) h2.textContent = 'Min bil / lager';
    initBiler();
    [40,120,300,700].forEach(function(ms){ setTimeout(function(){ show(app); if(app) app.classList.remove('ril-starter'); show(side); }, ms); });
    return false;
  }
  window.handOpenMinBilHard = openMinBil;
  window.handOpenMinBil = openMinBil;
  window.visBilerSide = openMinBil;
  window.handVisMinBilAnsatt = openMinBil;
  function bind(){
    var b = $('visBilerKnapp');
    if(!b) return;
    b.type = 'button';
    b.textContent = 'Min bil / fyll lager';
    b.setAttribute('data-modul','biler');
    b.setAttribute('data-role','ansatt-bil');
    b.onclick = openMinBil;
    show(b);
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest ? e.target.closest('#visBilerKnapp,[data-role="ansatt-bil"]') : null;
    if(!b) return;
    return openMinBil(e);
  }, true);
  document.addEventListener('handPartialerLastet', function(){ bind(); setTimeout(bind,50); setTimeout(bind,300); });
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
  window.addEventListener('load', function(){ bind(); setTimeout(bind,300); });
})();
</script>

<script charset="UTF-8">

   - Stopper PDF/about:blank for ansatt-bestilling.

   - Admin viser navn/varetekst, Bekreft-knapp og historikk.

   - Ansatt trykker Bekreft og legg på bil; først da oppdateres hand_bil_lager og hand_lagerlogg.

(function(){
  'use strict';
  if (window.__rilBestillingBillagerRest) return;
  window.__rilBestillingBillagerRest = true;

  var busySend = false, busyConfirm = false, showHistory = false, blokkPdfTil = 0;
  var realOpen = window.open;
  function s(v){ return String(v == null ? '' : v); }
  function low(v){ return s(v).toLowerCase(); }
  function num(v){ var n = Number(s(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; }
  function intNum(v){ return Math.max(0, Math.round(num(v))); }
  function $(id){ return document.getElementById(id); }
  function client(){ return window.supabaseClient || window.supabase || null; }
  function nowIso(){ return new Date().toISOString(); }
  function esc(v){ return s(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

    if (Date.now() < blokkPdfTil && (/about:blank|lagerliste|fyll bil|pdf|print/i.test(combined) || !s(url))) {
      console.warn('Stoppet PDF/lagerliste-popup fra bestilling:', combined);
      return { document:{ open:function(){}, write:function(){}, close:function(){} }, focus:function(){}, print:function(){}, close:function(){} };
    }
    return realOpen ? realOpen.apply(window, arguments) : null;
  };

  async function firmaId(){
    try{ if(typeof window.hentAktivFirmaId === 'function') return await window.hentAktivFirmaId(); }catch(e){}
    return window.aktivFirmaId || localStorage.getItem('aktivFirmaId') || localStorage.getItem('firmaId') || localStorage.getItem('firma_id') || null;
  }
  function innloggetEpost(){ return window.innloggetEpost || window.handInnloggetEpost || localStorage.getItem('handInnloggetEpost') || localStorage.getItem('innloggetEpost') || localStorage.getItem('epost') || null; }
  function innloggetNavn(){ return window.innloggetAnsattNavn || window.innloggetNavn || window.handInnloggetNavn || localStorage.getItem('innloggetAnsattNavn') || localStorage.getItem('handInnloggetNavn') || localStorage.getItem('innloggetNavn') || ''; }
  async function hentetAvForBil(){
    var c=client(), aktivBil=bilId()||'';
    var uid=window.innloggetUserId||localStorage.getItem('innloggetUserId')||localStorage.getItem('authUserId')||'';

  async function fetchMap(table, ids){
    var c=client(), map=new Map(); ids=Array.from(new Set((ids||[]).filter(Boolean).map(String)));
    if(!c || !ids.length) return map;
    try{ var r=await c.from(table).select('*').in('id', ids); if(!r.error) (r.data||[]).forEach(function(x){ map.set(String(x.id), x); }); }catch(e){}
    return map;
  }
  async function insertTrygt(table, rows){
    var c=client(), data=rows.map(function(x){return Object.assign({},x);});
    for(var i=0;i<80;i++){
      var res=await c.from(table).insert(data).select('*');
      if(!res.error) return res;
      var msg=s(res.error.message);
