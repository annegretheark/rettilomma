<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nytt passord</title>
  <style>
    body { font-family: Arial, sans-serif; background:#151819; color:#f3f4f6; margin:0; padding:20px; }
    .kort { background:#171a1b; max-width:520px; margin:60px auto; padding:22px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
    label { display:block; margin-top:12px; font-weight:bold; }
    input { width:100%; box-sizing:border-box; padding:10px; margin-top:4px; border-radius:8px; border:1px solid #ccc; }
    button { padding:11px 14px; margin-top:14px; border:0; border-radius:8px; background:#1f6feb; color:white; cursor:pointer; }
    .melding { margin-top:12px; color:#fca5a5; font-weight:bold; }
    .ok { color:#86efac; }
  </style>
</head>
<body>
  <section class="kort">
    <h1>Nytt passord</h1>
    <p>Skriv inn nytt passord og lagre.</p>

    <label for="nyttPassord">Nytt passord</label>
    <input id="nyttPassord" type="password" autocomplete="new-password">

    <label for="gjentaPassord">Gjenta passord</label>
    <input id="gjentaPassord" type="password" autocomplete="new-password">

    <button id="lagrePassordKnapp" type="button">Lagre nytt passord</button>
    <div id="melding" class="melding"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core/config.js?v=5003"></script>
  <script>
    function visMelding(tekst, ok) {
      const el = document.getElementById("melding");
      if (!el) return;
      el.textContent = tekst || "";
      el.className = ok ? "melding ok" : "melding";
    }

    async function lagreNyttPassord() {
      const p1 = document.getElementById("nyttPassord")?.value || "";
      const p2 = document.getElementById("gjentaPassord")?.value || "";

      if (!p1 || !p2) {
        visMelding("Skriv inn passord begge steder.");
        return;
      }

      if (p1 !== p2) {
        visMelding("Passordene er ikke like.");
        return;
      }

      if (p1.length < 6) {
        visMelding("Passord må være minst 6 tegn.");
        return;
      }

      if (!window.supabaseClient || !supabaseClient.auth) {
        visMelding("Supabase er ikke lastet. Sjekk js/core/config.js.");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: p1 });

      if (error) {
        visMelding("Kunne ikke lagre passord: " + error.message);
        return;
      }

      visMelding("Passordet er lagret. Du kan lukke denne siden og logge inn.", true);
    }

    document.getElementById("lagrePassordKnapp").onclick = lagreNyttPassord;
  </script>
</body>
</html>
