

    <div id="handTopbarKort" class="kort" style="max-width:760px;width:100%;margin:0 auto 16px auto;box-sizing:border-box;">
      <div id="innloggetBrukerBoks" class="innlogget-bruker-boks">
        Innlogget bruker: <strong id="innloggetBrukerVisning">Ikke innlogget</strong>
        <span id="innloggetRolleVisning"></span>
      </div>

      <div class="topplinje">
        <button id="visTimerKnapp" type="button">Timer</button>
        <button id="visJobberKnapp" type="button">Jobber</button>
        <button id="visFravaerKnapp" type="button">Fravær / Flexi</button>
        <button id="sysadminModeKnapp" class="systemadmin-only sysadmin-entry skjult" type="button" style="display:none; background:#7c3aed;">Sysadm</button>

        <button id="visBilerKnapp" data-modul="biler" data-role="ansatt-bil" type="button" onclick="return window.handOpenMinBilHard ? window.handOpenMinBilHard(event) : false;">Min bil / fyll lager</button>

        <div class="meny-gruppe admin-only" id="adminMenyGruppe">
          <button id="adminMenyKnapp" type="button" aria-haspopup="true" aria-expanded="false">Admin ▼</button>
          <div class="meny-panel" id="adminMenyPanel">
            <div class="meny-overskrift">Kunder og salg</div>
            <button id="visKundeKnapp" type="button" data-admin-target="kunder">Kunder</button>
            <button id="visTilbudKnapp" type="button" data-admin-target="tilbud">Tilbud</button>
            <button id="visFakturaKnapp" data-modul="faktura" type="button" data-admin-target="faktura">Faktura</button>

            <div class="meny-overskrift">Drift</div>
            <button id="visLonnKnapp" data-modul="lonn" type="button" data-admin-target="lonn">Lønn</button>
            <button id="visAdminVarerKnapp" data-modul="varer" type="button" data-admin-target="varer">Lager / Varer</button>
            <button id="visAdminBilerKnapp" data-modul="biler" type="button" data-admin-target="biler">Biler</button>
            <button id="visBilBestillingerKnapp" data-modul="bilbestillinger" type="button" data-admin-target="bestillinger">Bestillinger</button>

            <div class="meny-overskrift">Firma og ansatte</div>
            <button id="visAnsattKnapp" type="button" data-admin-target="ansatte">Ansatte</button>
            <button id="visFirmaKnapp" type="button" data-admin-target="firma">Firma</button>

            <div class="meny-overskrift">System</div>
            <button id="visBackupKnapp" type="button" data-admin-target="backup">Backup/Restore</button>
            <button id="visTestKnapp" type="button" data-admin-target="testpanel">Testpanel</button>
            <button id="visModulerKnapp" class="systemadmin-only" type="button" data-admin-target="moduler">⚙️ Moduler</button>
          </div>
        </div>

        <a id="loggUtKnapp" href="./logout.html" role="button" class="secondary" style="margin-left:auto; display:inline-block; text-decoration:none; background:#444; color:#fff; padding:10px 16px; border-radius:8px;" onclick="return window.handLoggUtHardt ? window.handLoggUtHardt(event) : true;">Logg ut</a>
</div>
