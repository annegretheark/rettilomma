  <script>
  (function () {
    function partialUrl(holder) {
      return holder.getAttribute("data-hand-partial") + "?v=20260623-inline-app-hidden";
    }

    function hentPartialer() {
      return Array.from(document.querySelectorAll("[data-hand-partial]"));
    }

    function varslePartialerKlare() {
      document.dispatchEvent(new Event("handPartialerLastet"));
      if (typeof window.handFyllFirmaVelgereDirekte === "function") window.handFyllFirmaVelgereDirekte();
      if (typeof window.handKobleKnapperEtterPartials === "function") window.handKobleKnapperEtterPartials();
      if (typeof window.handKobleVarerKnapper === "function") window.handKobleVarerKnapper();
    }

    function lastPartialerSynkront() {
      const holders = hentPartialer();
      for (const holder of holders) {
        const url = partialUrl(holder);
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, false);
        xhr.setRequestHeader("Cache-Control", "no-store");
        xhr.send(null);
        if ((xhr.status < 200 || xhr.status >= 300) && xhr.status !== 0) {
          throw new Error("Kunne ikke laste " + url);
        }
        holder.outerHTML = xhr.responseText;
      }
    }

    async function lastPartialerAsynkront() {
      const holders = hentPartialer();
      for (const holder of holders) {
        const url = partialUrl(holder);
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("Kunne ikke laste " + url);
        holder.outerHTML = await res.text();
      }
    }

    try {
      lastPartialerSynkront();
      window.__handPartialerLastet = true;
      window.handPartialerKlare = Promise.resolve();
    } catch (e) {
      console.warn("Synkron lasting av partials feilet, bruker asynkron fallback:", e);
      window.handPartialerKlare = lastPartialerAsynkront().then(function () {
        window.__handPartialerLastet = true;
      });
    }

    window.handPartialerKlare
      .then(function () { setTimeout(varslePartialerKlare, 0); })
      .catch(function (e) {
        console.error("Partialer ble ikke ferdig lastet:", e);
        const appSide = document.getElementById("appSide");
        if (appSide) {
          appSide.innerHTML = '<section class="kort"><h2>Kunne ikke laste Håndverker</h2><div class="melding">Oppdater siden. Hvis feilen fortsetter, sjekk at partial-filene ligger i handverker/partials.</div></section>';
          appSide.classList.remove("skjult");
        }
      });
  })();
  </script>

<script charset="UTF-8">
/* RIL 2026-06-23 BESTILLING BEKREFT REST BILLAGER:
   - Stopper PDF/about:blank for ansatt-bestilling.
   - Sender bestilling digitalt til hand_bil_bestilling.
   - Admin viser navn/varetekst, Bekreft-knapp og historikk.
   - Bekreftede ordre skjules fra aktive og kan ikke bekreftes igjen.
   - Admin bekrefter godkjent/rest og sender liste til ansatt på Fyll bil.
   - Ansatt trykker Godkjenn og legg på bil; først da oppdateres hand_bil_lager og hand_lagerlogg.
*/
(function(){
  'use strict';
  if (window.__rilBestillingBillagerRest) return;
  window.__rilBestillingBillagerRest = true;

  var busySend = false, busyConfirm = false, showHistory = false, blokkPdfTil = 0;
  var realOpen = window.open;
  function s(v){ return String(v == null ? '' : v); }
  function low(v){ return s(v).toLowerCase(); }
  function num(v){ var n = Number(s(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; }
  function intNum(v){ return Math.max(0, Math.round(num(v))); }
  function $(id){ return document.getElementById(id); }
  function client(){ return window.supabaseClient || window.supabase || null; }
  function nowIso(){ return new Date().toISOString(); }
  function esc(v){ return s(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function text(el){ return s(el && (el.innerText || el.textContent || el.value || el.title || (el.getAttribute && el.getAttribute('aria-label')))).trim(); }

  window.open = function(url, name, specs){
    var combined = s(url)+' '+s(name)+' '+s(specs);
    if (Date.now() < blokkPdfTil && (/about:blank|lagerliste|fyll bil|pdf|print/i.test(combined) || !s(url))) {
      console.warn('Stoppet PDF/lagerliste-popup fra bestilling:', combined);
      return { document:{ open:function(){}, write:function(){}, close:function(){} }, focus:function(){}, print:function(){}, close:function(){} };
    }
    return realOpen ? realOpen.apply(window, arguments) : null;
  };

  async function firmaId(){
    try{ if(typeof window.hentAktivFirmaId === 'function') return await window.hentAktivFirmaId(); }catch(e){}
    return window.aktivFirmaId || localStorage.getItem('aktivFirmaId') || localStorage.getItem('firmaId') || localStorage.getItem('firma_id') || null;
  }
  function innloggetEpost(){ return window.innloggetEpost || window.handInnloggetEpost || localStorage.getItem('innloggetEpost') || localStorage.getItem('handInnloggetEpost') || localStorage.getItem('epost') || null; }
  function innloggetNavn(){ return window.innloggetNavn || window.handInnloggetNavn || localStorage.getItem('handInnloggetNavn') || localStorage.getItem('innloggetNavn') || ''; }
  function bilId(){
    try{ if(typeof window.hentValgtBilIdForBilLager === 'function') return window.hentValgtBilIdForBilLager() || ''; }catch(e){}
    var el = $('bilLagerBilValg') || document.querySelector('select[id*="bil" i],select[name*="bil" i]');
    return (el && el.value) || localStorage.getItem('aktivBilId') || null;
  }
  function bilNavn(){
    var el = $('bilLagerBilValg') || document.querySelector('select[id*="bil" i],select[name*="bil" i]');
    if(el && el.selectedIndex >= 0 && el.options[el.selectedIndex]) return text(el.options[el.selectedIndex]);
    return localStorage.getItem('aktivBilNavn') || '';
  }
  function melding(msg, bad){
    var el = $('bilLagerMelding') || $('bilMelding') || $('lagerMelding') || document.querySelector('.melding');
    if(el){ el.textContent = msg; el.style.color = bad ? '#fca5a5' : '#86efac'; }
    else alert(msg);
  }

  function isSendButton(el){
    var b = el && el.closest && el.closest('button,a,input[type="button"],input[type="submit"],[role="button"]');
    if(!b) return null;
    var id = low((b.id||'')+' '+(b.name||'')+' '+(b.className||'')+' '+(b.getAttribute && (b.getAttribute('onclick')||'')));
    var t = low(text(b));
    if (id.indexOf('lagpdffyllbiltilagerknapp') >= 0) return b;
    if (id.indexOf('sendbillagerbestillingknapp') >= 0) return b;
    if (t.indexOf('send bestilling til admin') >= 0) return b;
    if (t.indexOf('lag bestilling til admin') >= 0) return b;
    return null;
  }
  function isAdminBestillingButton(el){
    var b = el && el.closest && el.closest('button,a,[role="button"],[data-side],[data-modul],[data-target]');
    if(!b) return null;
    var t = low(text(b)).trim();
    var id = low(b.id||'');
    var d = low((b.getAttribute && (b.getAttribute('data-side')||b.getAttribute('data-modul')||b.getAttribute('data-target')||'')) || '');
    if(t === 'bestillinger' || id === 'visbilbestillingerknapp' || d.indexOf('bestilling') >= 0) return b;
    return null;
  }
  function isFyllBilButton(el){
    var b = el && el.closest && el.closest('button,a,[role="button"],[data-side],[data-modul],[data-target]');
    if(!b) return null;
    var t = low(text(b));
    var id = low(b.id||'');
    var d = low((b.getAttribute && (b.getAttribute('data-side')||b.getAttribute('data-modul')||b.getAttribute('data-target')||'')) || '');
    if(t.indexOf('biler') >= 0 || t.indexOf('bil-lager') >= 0 || t.indexOf('fyll bil') >= 0 || id.indexOf('bil') >= 0 || d.indexOf('bil') >= 0) return b;
    return null;
  }

  function ordrelinjerFraSkjerm(){
    var list = [];
    document.querySelectorAll('.bil-lager-antall-liste,input[data-vare-id][type="number"],input[data-vare-id][inputmode="numeric"]').forEach(function(inp){
      var antall = intNum(inp.value);
      if(antall <= 0) return;
      var vareId = inp.dataset.vareId || inp.getAttribute('data-vare-id') || '';
      var row = inp.closest('tr,.vare-rad,.lager-rad,.rad,li,div');
      var min = null;
      if(vareId){ try{ min = document.querySelector('.bil-lager-min-liste[data-vare-id="'+(window.CSS&&CSS.escape?CSS.escape(vareId):vareId)+'"]'); }catch(e){} }
      var cells = row ? Array.from(row.querySelectorAll('td,th')) : [];
      var varenr = cells[0] ? text(cells[0]) : '';
      var varenavn = cells[1] ? text(cells[1]) : (row ? text(row).replace(s(inp.value),'').trim() : 'Vare');
      list.push({ vare_id: vareId || null, varenr: varenr || null, varenavn: varenavn || null, antall: antall, minimum_antall: intNum(min && min.value) });
    });
    return list;
  }
  async function fetchMap(table, ids){
    var c=client(), map=new Map(); ids=Array.from(new Set((ids||[]).filter(Boolean).map(String)));
    if(!c || !ids.length) return map;
    try{ var r=await c.from(table).select('*').in('id', ids); if(!r.error) (r.data||[]).forEach(function(x){ map.set(String(x.id), x); }); }catch(e){}
    return map;
  }
  async function insertTrygt(table, rows){
    var c=client(), data=rows.map(function(x){return Object.assign({},x);});
    for(var i=0;i<80;i++){
      var res=await c.from(table).insert(data).select('*');
      if(!res.error) return res;
      var msg=s(res.error.message);
      var col=(msg.match(/Could not find the '([^']+)' column/i)||[])[1] || (msg.match(/column "([^"]+)".*does not exist/i)||[])[1];
      if(col){ data.forEach(function(r){ delete r[col]; }); continue; }
      var bad=(msg.match(/invalid input syntax for type uuid:\s*"([^"]+)"/i)||[])[1];
      if(bad){ data.forEach(function(r){ Object.keys(r).forEach(function(k){ if(s(r[k])===s(bad)) delete r[k]; }); }); continue; }
      return res;
    }
    return { error:{ message:'Kunne ikke lagre i '+table } };
  }
  async function updateTrygt(table, id, changes){
    var c=client(), data=Object.assign({}, changes);
    for(var i=0;i<80;i++){
      var res=await c.from(table).update(data).eq('id', id).select('*');
      if(!res.error) return res;
      var msg=s(res.error.message);
      var col=(msg.match(/Could not find the '([^']+)' column/i)||[])[1] || (msg.match(/column "([^"]+)".*does not exist/i)||[])[1];
      if(col && Object.prototype.hasOwnProperty.call(data,col)){ delete data[col]; continue; }
      return res;
    }
    return { error:{ message:'Kunne ikke oppdatere '+table } };
  }
  async function sendDigital(ev){
    if(ev){ ev.preventDefault(); ev.stopPropagation(); if(ev.stopImmediatePropagation) ev.stopImmediatePropagation(); }
    if(busySend) return false; busySend=true; blokkPdfTil=Date.now()+12000;
    try{
      var c=client(); if(!c){ melding('Supabase er ikke lastet. Oppdater siden.', true); return false; }
      var bid=bilId(); if(!bid){ melding('Velg bil først.', true); return false; }
      var linjer=ordrelinjerFraSkjerm(); if(!linjer.length){ melding('Skriv antall på minst én vare før du sender bestilling til admin.', true); return false; }
      melding('Sender bestilling til admin...');
      var varer=await fetchMap('hand_vare', linjer.map(function(x){return x.vare_id;}));
      var now=nowIso(), batch=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('bestilling-'+Date.now());
      var fid=await firmaId(), epost=innloggetEpost();
      var payload=linjer.map(function(l){ var v=l.vare_id?(varer.get(String(l.vare_id))||{}):{}; return {
        bestilling_id:batch, firma_id:fid||null, bil_id:bid||null, bil_navn:bilNavn()||null,
        vare_id:l.vare_id||null, varenr:l.varenr||v.varenr||v.varenr||v.nr||null, varenavn:l.varenavn||v.navn||v.varenavn||v.beskrivelse||null,
        bruker_epost:epost, bruker_navn:innloggetNavn()||epost, opprettet_av:epost,
        bestilt:l.antall, antall:l.antall, levert:0, mottatt:0, godkjent:0, rest:l.antall,
        minimum_antall:l.minimum_antall||0, status:'venter', opprettet:now, created_at:now
      }; });
      var res=await insertTrygt('hand_bil_bestilling', payload);
      if(res.error){ melding('Kunne ikke sende bestilling til admin: '+(res.error.message||res.error), true); return false; }
      document.querySelectorAll('.bil-lager-antall-liste,input[data-vare-id][type="number"],input[data-vare-id][inputmode="numeric"]').forEach(function(i){ i.value=''; });
      melding('Bestilling sendt til admin.');
      setTimeout(visAnsattBekreftelser, 600);
      return false;
    } finally { setTimeout(function(){ busySend=false; },900); }
  }

  function show(el){ if(!el) return; el.hidden=false; el.style.display=''; el.style.visibility='visible'; el.classList.remove('skjult','hidden','modul-skjult'); el.removeAttribute('aria-hidden'); }
  function hide(el){ if(!el) return; el.hidden=true; el.style.display='none'; el.classList.add('skjult','hidden'); }
  function adminShell(){
    var app=$('appSide')||document.body; show(app);
    ['timerSide','jobberSide','tilbudSide','backupSide','fakturaSide','varerSide','bilerSide','kundeSide','kunderSide','ansattSide','ansatteSide','firmaSide','testSide','lonnPanel','fravaerSide','modulerSide','sysadminPanelSide'].forEach(function(id){ hide($(id)); });
    var side=$('bilBestillingerSide')||$('adminBilBestillinger')||$('adminBilBestillingerPanel');
    if(!side){ side=document.createElement('section'); side.id='bilBestillingerSide'; side.className='kort'; app.appendChild(side); }
    show(side); var h=$('handSideOverskrift'); if(h) h.textContent='Bestillinger';
    side.innerHTML='<h2 style="text-align:center;margin-top:0;color:#f8fafc">Bestillinger fra ansatte</h2><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px"><button id="rilVisAktiveBestillinger" type="button" style="background:#1f6feb;color:white;border:0;border-radius:8px;padding:9px 12px">Aktive</button><button id="rilVisBekreftedeBestillinger" type="button" style="background:#374151;color:white;border:0;border-radius:8px;padding:9px 12px">Finn bekreftede</button></div><div id="rilOrdersMsg" style="padding:14px;border:1px solid #334155;border-radius:12px;background:#0f172a;color:#e5e7eb;font-weight:700">Ingen bestillinger</div><div id="rilOrdersContent"></div>';
    $('rilVisAktiveBestillinger').onclick=function(){showHistory=false;showOrders();}; $('rilVisBekreftedeBestillinger').onclick=function(){showHistory=true;showOrders();};
  }
  function isConfirmed(r){ return /^(bekreftet|admin_bekreftet|admin_besvart|godkjent|besvart|lagt_pa_bil|levert|ferdig|mottatt|avsluttet|utlevert|fullfort|fullført|arkivert)$/.test(low(r&&r.status)) || r&&r.bekreftet===true; }
  function rilLagtIds(){ try{return JSON.parse(localStorage.getItem('ril_lagt_pa_bil_ids')||'[]').map(String);}catch(e){return [];} }
  function rilMerkLagtIds(ids){ try{ var a=rilLagtIds(); (ids||[]).map(String).forEach(function(id){ if(id && a.indexOf(id)<0) a.push(id); }); localStorage.setItem('ril_lagt_pa_bil_ids', JSON.stringify(a.slice(-2000))); }catch(e){} }
  function ansattHarLagtPaBil(r){
    if(!r) return false;
    if(r.id && rilLagtIds().indexOf(s(r.id))>=0) return true;
    if(/^(lagt_pa_bil|levert|mottatt|ferdig|utlevert|arkivert)$/.test(low(r.status))) return true;

  function el(id){ return document.getElementById(id); }
  function show(x){ if(!x) return; x.classList && x.classList.remove('skjult','hidden'); x.hidden=false; x.style.display=''; }
  function hide(x){ if(!x) return; x.classList && x.classList.add('skjult'); x.style.display='none'; }

  function hideAll(){ ALL_IDS.forEach(id => hide(el(id))); }

  function call(fn){
    if (typeof window[fn] === 'function') {
      try { window[fn](); return true; } catch(e) { console.warn('RIL admin init feilet:', fn, e); }
    }
    return false;
  }

  function openTarget(target){
    const cfg = TARGETS[target];
    if (!cfg) return;
    hideAll();
    let shown = false;
    cfg.ids.forEach(id => { const node = el(id); if(node){ show(node); shown = true; } });
    // If the old app has a navigation function, call it after our show/hide. Some modules need data refresh.
    (cfg.init || []).forEach(call);

    setTimeout(function(){ cfg.ids.forEach(id => show(el(id))); }, 250);

<script>
/* RIL 20260624: Stabil start uten blink.
   Etter innlogging skal bare toppmenyen vises.
   Ingen modul skal åpnes automatisk: ikke Timer, ikke Jobber, ikke Tilbud, ikke Kunder. */
(function(){
  'use strict';
  if (window.__rilStartKunMenyUtenBlink20260624) return;
  window.__rilStartKunMenyUtenBlink20260624 = true;

  var startSatt = false;
  var brukerKlikketNavigasjon = false;
  var alleSideIder = ['timerSide','jobberSide','fravaerSide','tilbudSide','backupSide','fakturaSide','varerSide','bilerSide','kundeSide','kunderSide','ansattSide','ansatteSide','firmaSide','testSide','testpanelSide','lonnPanel','lonnSide','bilBestillingerSide','adminBilBestillinger','adminBilBestillingerPanel','modulerSide','sysadminPanelSide','adminSide'];

  function el(id){ return document.getElementById(id); }
  function skjul(node){ if(!node) return; node.hidden=true; node.style.display='none'; node.classList && node.classList.add('skjult','hidden'); }
  function app(){ return el('appSide'); }
  function appSynlig(){ var a=app(); return !!(a && a.style.display !== 'none' && !a.hidden && !a.classList.contains('skjult')); }
  function skjulAlleSider(){ alleSideIder.forEach(function(id){ skjul(el(id)); }); }

  function lukkAdminMeny(){
    var panel=el('adminMenyPanel');
    if(panel){ panel.style.display='none'; panel.classList.remove('open'); }
    var knapp=el('adminMenyKnapp');
    if(knapp) knapp.setAttribute('aria-expanded','false');
  }

  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest && e.target.closest('button,a,[data-admin-target]');
    if(!t) return;
    if(t.id === 'loginKnapp') return;
    brukerKlikketNavigasjon = true;

    // RIL fix: når vanlig bruker trykker en toppknapp må startlåsen fjernes.
    // Ellers overstyrer CSS-en #appSide.ril-starter ... display:none !important,
    // og sidene virker som om knappene er døde.
    var a = app();
    if (a) a.classList.remove('ril-starter');
  }, true);

  function visKunMenySomStart(){
    var a=app();
    if(!a || !appSynlig() || startSatt || brukerKlikketNavigasjon) return;
    startSatt = true;

    skjulAlleSider();
    lukkAdminMeny();
    a.classList.remove('ril-starter');

    // Gamle scripts kan prøve å åpne en modul etter innlogging.
    // Derfor tvinger vi alle panelsider skjult et par ganger etterpå.
    [50, 200, 500, 1000].forEach(function(ms){
      setTimeout(function(){
        if(!brukerKlikketNavigasjon){
          skjulAlleSider();
          lukkAdminMeny();
        }
        a.classList.remove('ril-starter');
      }, ms);
    });
  }

  function overvåk(){
    var a=app();
    if(!a) return;
    if(!brukerKlikketNavigasjon){ a.classList.add('ril-starter'); skjulAlleSider(); }

    var obs = new MutationObserver(function(){ setTimeout(visKunMenySomStart, 0); });
    obs.observe(a, { attributes:true, attributeFilter:['class','style','hidden'] });

    setTimeout(visKunMenySomStart, 25);
    setTimeout(visKunMenySomStart, 150);
    setTimeout(visKunMenySomStart, 500);
  }

  document.addEventListener('DOMContentLoaded', overvåk);
  document.addEventListener('handPartialerLastet', function(){ setTimeout(overvåk, 0); });
})();
</script>

<script id="ril-kundenr-visning-safe-fix">
(function(){
  function finnNrFraOption(opt){
    if(!opt) return '';
    var ds = opt.dataset || {};
    var nr = (ds.kundenr || ds.kundeNr || ds.kunde_nr || '').toString().trim();
    if(nr) return nr;
    var txt = (opt.textContent || '').trim();
    var m = txt.match(/^\s*([^\s\-–—]+)\s*[-–—]\s+/);
    return m ? m[1].trim() : '';
  }
  function oppdaterKundenr(){
    var valg = document.getElementById('kundeValg');
    var felt = document.getElementById('kundeNrVisning');
    if(!valg || !felt) return;
    var opt = valg.options && valg.selectedIndex >= 0 ? valg.options[valg.selectedIndex] : null;
    felt.value = finnNrFraOption(opt);
  }
  document.addEventListener('change', function(e){ if(e.target && e.target.id === 'kundeValg') setTimeout(oppdaterKundenr,0); }, true);
  document.addEventListener('input', function(e){ if(e.target && e.target.id === 'kundeValg') setTimeout(oppdaterKundenr,0); }, true);
  document.addEventListener('click', function(e){ if(e.target && e.target.id === 'kundeValg') setTimeout(oppdaterKundenr,50); }, true);
  var obs = new MutationObserver(function(){ setTimeout(oppdaterKundenr,0); });
  function start(){
    var valg = document.getElementById('kundeValg');
    if(valg && !valg.__rilKundenrSafeObs){
      valg.__rilKundenrSafeObs = true;
      obs.observe(valg,{childList:true,subtree:true,attributes:true,attributeFilter:['value','selected']});
    }
    oppdaterKundenr();
  }
  document.addEventListener('DOMContentLoaded', start);
  window.addEventListener('load', function(){ start(); setTimeout(start,300); setTimeout(start,1000); });
  setTimeout(start,1500); setTimeout(start,3000);
})();
</script>

<script id="hand-inline-admin-not-sysadm-v31">
(function(){
  function n(v){return String(v==null?'':v).trim().toLowerCase();}
  function hide(el){if(!el)return;el.classList.add('hidden','skjult');el.hidden=true;el.style.display='none';el.setAttribute('aria-hidden','true');}
  function show(el){if(!el)return;el.classList.remove('hidden','skjult','modul-skjult');el.hidden=false;el.style.display='';el.removeAttribute('aria-hidden');}
  function c(){return window.supabaseClient||(window.supabase&&window.supabase.from?window.supabase:null);}
  function sys(r){r=n(r);return r==='sysadm'||r==='sysadmin'||r==='systemadmin';}
  async function email(){try{var cl=c();if(cl&&cl.auth&&cl.auth.getUser){var u=await cl.auth.getUser();var e=n(u&&u.data&&u.data.user&&u.data.user.email);if(e)return e;}}catch(e){} return n(window.innloggetEpost||window.innloggetBrukerEpost||localStorage.getItem('handInnloggetEpost')||localStorage.getItem('innloggetEpost'));}
  async function run(){
    var e=await email(), role='';
    try{var cl=c(); if(cl&&e){var r=await cl.from('hand_ansatt').select('rolle,epost').eq('epost',e); var rows=(r&&r.data)||[]; var roles=rows.map(x=>n(x.rolle)).filter(Boolean); role=roles.find(sys)||roles.find(x=>x==='admin'||x==='administrator')||roles[0]||'';}}catch(err){}
    if(!role){ role=n(window.innloggetRolle||localStorage.getItem('handInnloggetRolle')||localStorage.getItem('innloggetRolle')); if(sys(role)) role=''; }
    var isSys=sys(role), isAdmin=isSys||role==='admin'||role==='administrator';
    window.innloggetRolle=role; window.erSystemadmin=isSys; window.erAdmin=isAdmin;
    try{localStorage.setItem('handInnloggetRolle',role||'');localStorage.setItem('innloggetRolle',role||''); if(!isSys){localStorage.removeItem('rilSysadminModus');localStorage.removeItem('sysadminModus');localStorage.removeItem('handSysadminModus');}}catch(e){}
    document.querySelectorAll('.systemadmin-only,.sysadmin-entry').forEach(el=>isSys?show(el):hide(el));
    ['sysadminModeKnapp','sysadminNyKundeKnapp','sysadminKundelisteKnapp','sysadminModulerKnapp','visModulerKnapp'].forEach(id=>{var el=document.getElementById(id); if(el) isSys?show(el):hide(el);});

  setTimeout(run,1500); setTimeout(run,3000); window.handAdminNotSysadmGuard=run;
})();

<script>
/* RIL 20260624 v37: Min bil/bil-lager og bestillingsflyt tilbake.
   Sysadm er fortsatt sperret for vanlige admin/brukere. */
(function(){
  'use strict';
  if (window.__handMinBilBestillingV37) return;
  window.__handMinBilBestillingV37 = true;

  function $(id){ return document.getElementById(id); }
  function show(el){ if(!el) return; el.hidden=false; el.style.display=''; el.classList && el.classList.remove('skjult','hidden','modul-skjult'); el.removeAttribute && el.removeAttribute('aria-hidden'); }
  function hide(el){ if(!el) return; el.hidden=true; el.style.display='none'; el.classList && el.classList.add('skjult'); }
  function topbar(){ return document.querySelector('#handTopbarKort .topplinje') || document.querySelector('.topplinje') || $('handTopbarKort'); }
  function adminGroup(){ return $('adminMenyGruppe') || document.querySelector('.meny-gruppe.admin-only'); }
  function panel(){ return $('adminMenyPanel'); }

  function ensureMinBilButton(){
    var tb = topbar();
    if(!tb) return;
    var btn = $('visBilerKnapp');
    if(!btn){
      btn = document.createElement('button');
      btn.id = 'visBilerKnapp';
      btn.type = 'button';
      btn.setAttribute('data-modul','biler');
      btn.setAttribute('data-role','ansatt-bil');
      var ag = adminGroup();
      if(ag && ag.parentNode) ag.parentNode.insertBefore(btn, ag); else tb.appendChild(btn);
    }
    btn.textContent = 'Min bil / fyll lager';
    btn.type = 'button';
    btn.setAttribute('data-modul','biler');
    btn.setAttribute('data-role','ansatt-bil');
    show(btn);
  }

  function ensureAdminMenuItems(){
    var p = panel();
    if(!p) return;
    function addHeading(text){
      var exists = Array.prototype.some.call(p.querySelectorAll('.meny-overskrift'), function(x){ return (x.textContent||'').trim().toLowerCase() === text.toLowerCase(); });
      if(!exists){ var h=document.createElement('div'); h.className='meny-overskrift'; h.textContent=text; p.appendChild(h); }
    }
    function addButton(id, text, target, modul){
      var b=$(id);
      if(!b){ b=document.createElement('button'); b.id=id; b.type='button'; p.appendChild(b); }
      b.textContent=text; b.type='button'; b.setAttribute('data-admin-target', target); if(modul) b.setAttribute('data-modul', modul); show(b);
    }
    addHeading('Drift');
    addButton('visAdminVarerKnapp','Lager / Varer','varer','varer');
    addButton('visAdminBilerKnapp','Biler','biler','biler');
    addButton('visBilBestillingerKnapp','Bestillinger','bestillinger','bilbestillinger');
  }

  var sideIds = ['timerSide','jobberSide','fravaerSide','tilbudSide','backupSide','fakturaSide','varerSide','bilerSide','kundeSide','kunderSide','ansattSide','ansatteSide','firmaSide','testSide','testpanelSide','lonnPanel','lonnSide','bilBestillingerSide','adminBilBestillinger','adminBilBestillingerPanel','modulerSide','sysadminPanelSide','adminSide'];
  function hideAllPages(){ sideIds.forEach(function(id){ var el=$(id); if(el) hide(el); }); }
  function setTitle(t){ try{ if(typeof window.settHandSideOverskrift==='function') window.settHandSideOverskrift(t); }catch(e){} }
  function openBiler(){
    hideAllPages();
    var side=$('bilerSide');
    if(side) show(side);
    setTitle('Min bil / fyll lager');
    ['visBilerSide','lastBilerOgBilLager','handLastBiler','lastBiler','visBiler','lastVarer','handLastVarer'].forEach(function(fn){
      if(typeof window[fn] === 'function') { try{ window[fn](); }catch(e){ console.warn('Min bil init feilet:', fn, e); } }
    });
    setTimeout(function(){ var s=$('bilerSide'); if(s) { show(s); if(s.scrollIntoView) s.scrollIntoView({block:'start'}); } },80);
    setTimeout(function(){ var s=$('bilerSide'); if(s) show(s); },300);
  }

  function openAdminTarget(target){
    var cfg = {
      varer: { ids:['varerSide'], init:['visVarerSide','visVarer','lastVarer','handLastVarer','lastVarelager'] },
      biler: { ids:['bilerSide'], init:['visBilerSide','visBiler','lastBiler','lastBilerOgBilLager','handLastBiler'] },
      bestillinger: { ids:['bilBestillingerSide','adminBilBestillinger','adminBilBestillingerPanel'], init:['visBilBestillingerSide','renderAdminBilBestillinger','handLastAdminBilBestillinger','rilVisBestillinger'] }
    }[target];
    if(!cfg) return false;
    hideAllPages();
    cfg.ids.forEach(function(id){ show($(id)); });
    cfg.init.forEach(function(fn){ if(typeof window[fn]==='function') { try{ window[fn](); }catch(e){ console.warn('Admin init feilet:', fn, e); } } });
    setTimeout(function(){ cfg.ids.forEach(function(id){ show($(id)); }); },100);
    return true;
  }

  document.addEventListener('click', function(e){
    var mb = e.target && e.target.closest && e.target.closest('#visBilerKnapp');
    if(mb){ e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); openBiler(); return false; }
    var item = e.target && e.target.closest && e.target.closest('#visAdminVarerKnapp,#visAdminBilerKnapp,#visBilBestillingerKnapp,[data-admin-target="varer"],[data-admin-target="biler"],[data-admin-target="bestillinger"]');
    if(item){
      var target = item.getAttribute('data-admin-target') || (item.id==='visAdminVarerKnapp'?'varer':item.id==='visAdminBilerKnapp'?'biler':'bestillinger');
      if(openAdminTarget(target)){ var p=panel(); if(p){ p.style.display='none'; p.classList.remove('open'); } e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); return false; }
    }
  }, true);

  function apply(){ ensureMinBilButton(); ensureAdminMenuItems(); }
  document.addEventListener('DOMContentLoaded', function(){ apply(); setTimeout(apply,300); setTimeout(apply,1200); });
  window.addEventListener('load', function(){ apply(); setTimeout(apply,500); setTimeout(apply,1500); });
  setTimeout(apply, 2500); setTimeout(apply, 5000);
  window.handOpenMinBil = openBiler;
})();
</script>
