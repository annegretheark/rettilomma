<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Nytt passord - Veterinær</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial,sans-serif;background:#151819;color:#f3f4f6;margin:0;padding:20px;}
    .kort{background:#171a1b;max-width:460px;margin:40px auto;padding:22px;border-radius:12px;border:1px solid #2b3135;box-shadow:0 2px 10px rgba(0,0,0,.22);}
    label{display:block;margin-top:12px;font-weight:bold;}
    input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #4b5563;border-radius:8px;background:#f8fafc;color:#111827;}
    button{padding:11px 14px;margin:12px 6px 0 0;border:0;border-radius:8px;background:#1f6feb;color:white;cursor:pointer;font-size:15px;}
    .melding{margin-top:12px;color:#fca5a5;font-weight:bold;white-space:pre-wrap;}
    .ok{color:#86efac;}
    .lite{color:#cbd5e1;font-size:13px;line-height:1.35;}
    a{color:#93c5fd;}

    @media (max-width:600px){body{padding:10px;} .kort{max-width:none;margin:10px auto;padding:16px;} input,button{font-size:16px;min-height:44px;} button{width:100%;}}
  </style>
<script src="js/vet-password-redirect.js"></script>
</head>
<body>
  <div class="kort">
    <h1>Lag nytt passord</h1>
    <p class="lite">Skriv nytt passord. Det må være minst 6 tegn.</p>

    <label for="nyttPassord">Nytt passord</label>
    <input id="nyttPassord" type="password" autocomplete="new-password">

    <label for="gjentaPassord">Gjenta passord</label>
    <input id="gjentaPassord" type="password" autocomplete="new-password">

    <button id="lagrePassordKnapp" type="button">Lagre nytt passord</button>
    <div id="melding" class="melding"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    function visMelding(tekst, ok){
      const el = document.getElementById("melding");
      if (!el) return;
      el.textContent = tekst || "";
      el.classList.toggle("ok", !!ok);
    }
    function hashParams(){ return new URLSearchParams(String(window.location.hash || "").replace(/^#/, "")); }
    function queryParams(){ return new URLSearchParams(String(window.location.search || "").replace(/^\?/, "")); }

    async function klargjorRecoverySession(){
      const hp = hashParams();
      const qp = queryParams();
      const access_token = hp.get("access_token");
      const refresh_token = hp.get("refresh_token");
      const code = qp.get("code");

      // Supabase kan sende recovery-lenke enten med access_token/refresh_token i hash,
      // eller med PKCE-kode i query string. Støtt begge varianter.
      if (access_token && refresh_token) {
        const { error } = await supabaseClient.auth.setSession({ access_token, refresh_token });
        if (error) throw error;
        return;
      }
      if (code) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(code);
        if (error) throw error;
        return;
      }
    }

    async function lagrePassord(){
      const p1 = String(document.getElementById("nyttPassord")?.value || "");
      const p2 = String(document.getElementById("gjentaPassord")?.value || "");
      if (p1.length < 6) { visMelding("Passordet må være minst 6 tegn."); return; }
      if (p1 !== p2) { visMelding("Passordene er ikke like."); return; }
      visMelding("Lagrer nytt passord ...", true);
      try { await klargjorRecoverySession(); } catch(e) { visMelding("Passordlenken kunne ikke åpnes: " + e.message); return; }
      const { error } = await supabaseClient.auth.updateUser({ password: p1 });
      if (error) { visMelding("Kunne ikke oppdatere passord: " + error.message); return; }
      visMelding("Passordet er oppdatert. Du sendes til innlogging ...", true);
      setTimeout(function(){ window.location.href = "veterinaer-login.html"; }, 1200);
    }

    document.getElementById("lagrePassordKnapp")?.addEventListener("click", lagrePassord);
    document.getElementById("gjentaPassord")?.addEventListener("keydown", e => { if (e.key === "Enter") lagrePassord(); });
    visMelding("Klar til å lage nytt passord.", true);
  </script>
</body>
</html>
